<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Bar do Tibs</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9a150"/>
      <stop offset=".55" stop-color="#cf7a2c"/>
      <stop offset="1" stop-color="#a4561a"/>
    </linearGradient>
    <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a8"/>
      <stop offset="1" stop-color="#ffc56b"/>
    </linearGradient>
    <clipPath id="bowl">
      <path d="M13 21h38L32 40z"/>
    </clipPath>
  </defs>

  <!-- Fundo -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".22"/>

  <!-- Rodela de laranja na borda -->
  <g transform="translate(46 19)">
    <circle r="8.5" fill="#fdf8f1"/>
    <circle r="6.6" fill="#f6a23c"/>
    <g stroke="#fdf8f1" stroke-width="1.1" stroke-linecap="round">
      <path d="M0-5.6V5.6M-5.6 0H5.6M-4 -4L4 4M-4 4L4 -4"/>
    </g>
    <circle r="1.2" fill="#fdf8f1"/>
  </g>

  <!-- Drink dentro da taça -->
  <g clip-path="url(#bowl)">
    <rect x="10" y="25" width="44" height="18" fill="url(#drink)"/>
    <path d="M10 25.2q5.5-2 11 0t11 0t11 0t11 0" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/>
  </g>

  <!-- Taça (o "T" do Tibs) -->
  <g fill="none" stroke="#fdf8f1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 21h38L32 40z"/>
    <path d="M32 40v11"/>
    <path d="M24 51h16"/>
  </g>

  <!-- Palito com azeitona -->
  <path d="M22.5 14.5L33 32" stroke="#5a2f0c" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="30.4" cy="27.6" r="2.7" fill="#6e8f2a" stroke="#fdf8f1" stroke-width="1"/>
</svg>
